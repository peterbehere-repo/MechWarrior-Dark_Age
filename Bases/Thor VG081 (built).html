<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bipedal ’Mech Clix Base — Template (defaults: Atlas Solitude VG085)</title>
<style>
body{background:#111;color:#ddd;font:14px system-ui;margin:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:16px;letter-spacing:2px;margin:0;color:#bbb}
button{background:#2a2a30;color:#eee;border:1px solid #555;border-radius:6px;padding:8px 13px;font:13px system-ui;cursor:pointer;margin:0 3px}
button:hover{background:#3a3a42}
.status{min-height:20px;color:#9fd89f;font-weight:600}
.foot{color:#888;font-size:12px;max-width:680px;text-align:center}
/* ==== 3D heat drum: 6 panels (table cols 2-7) around a vertical-pole cylinder; col7
   (shutdown) wraps around to join col2 (green start). The drum rotates about its pole axis;
   the fixed window reveals one column at a time. ==== */
#stage{position:relative;width:640px;height:640px}
/* Incr 48: perspective 480 -> 2000 — at rest the front panel's projection is now 1.015x (was
   1.065x), so the flat combat-strip digits and the projected heat rows land within ~1px of each
   other in all three rows (with 480 the stretched bottom row sat 3.7px low). Rotation sweep is
   unchanged in character; the drum face just reads flatter, as it does on the real dial. */
#heat3d{position:absolute;left:0;top:0;width:34px;height:118px;perspective:2000px;perspective-origin:50% 50%;overflow:hidden}
#heat3d .winLight{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(255,255,255,.14) 46%,rgba(0,0,0,0) 66%,rgba(0,0,0,.6) 100%)}
#drum{position:absolute;left:0;top:4px;width:34px;height:108px; /* Incr 48: 5->4 centers residual projection offset */transform-style:preserve-3d;will-change:transform}
.panel{position:absolute;left:0;top:0;width:34px;height:108px;backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;border-radius:3px;box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
.cell{box-sizing:border-box;width:34px;height:32px;border-radius:3px;border:1.2px solid #33333a;display:flex;align-items:center;justify-content:center;font:800 19px system-ui;flex:none}
.cell.rad{font-size:22px}
/* ==== 3D twist knob (Incr 22): a COAXIAL extension of the heat drum's cylinder — the same
   vertical pole axis (x=240), same rotateY rotation, same transition, so knob and drum turn
   as one mechanism. 12 narrow flutes = knurled grip. Fixed gradient light stays put while
   the flutes revolve (cylindrical shading). Static SVG collar + cap sit underneath. ==== */
#knob3d{position:absolute;width:30px;height:40px;perspective:420px;perspective-origin:50% 50%;cursor:pointer;z-index:6}
#knobdrum{position:absolute;left:0;top:0;width:30px;height:40px;transform-style:preserve-3d;will-change:transform}
.kflute{position:absolute;top:0;height:40px;backface-visibility:hidden;border-radius:2px}
.kflute.a{background:#3a3a42;box-shadow:inset 0 0 4px rgba(0,0,0,.4)}
.kflute.b{background:#2b2b32;box-shadow:inset 0 0 4px rgba(0,0,0,.5)}
.knobLight{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(255,255,255,.24) 48%,rgba(0,0,0,0) 74%,rgba(0,0,0,.48) 100%)}
</style></head><body>

const SE_INFO={"Agility":{"cat":"Melee damage","optional":true,"desc2":"(optional) When this unit is the target of a close combat or special attack from an opposing figure, damage and impact damage scored is reduced to 1.","desc1":"(optional) ’Mech only. This unit reduces to 1 all damage received from opposing units by close combat, charge, ram, and death from above attacks."},"Alpha Strike":{"cat":"Energy damage","optional":true,"desc2":"(optional) When this unit makes a ranged combat attack against a single opposing target figure, turn its heat dial until it is shutdown; keep track of the number of turns needed to reach shutdown. If the attack succeeds, this unit gets +X to its damage value, where X equals the number of heat dial turns needed to reach shutdown.","desc1":"(optional) ’Mech only. When this ’Mech is given a ranged combat order with a single opposing unit as the target, click its heat dial until the shutdown icons appear; keep track of the number of clicks needed to reach shutdown. If the attack succeeds, the ’Mech’s damage value is increased a number of clicks equal to the number of clicks of heat this unit needed to reach shutdown. Once the ranged combat attack is resolved, this ’Mech is shutdown."},"Anti-Personnel":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) This unit’s ranged combat attacks affect its targets and any infantry in base contact with those targets. First, make one attack roll and compare the attack result to the defense values of the targets of the attack. Score damage per the rules to each target against which the attack succeeds. Then compare the attack result to the defense values of any infantry in base contact with the targets. Score damage equal to this unit’s damage value to each infantry against which the attack succeeds.","desc1":"(optional) This unit’s ranged combat attack affects the target unit and every infantry unit in base contact with the target, delivering this unit’s damage value to each unit hit. For this attack, only one dice roll is made and compared to each unit’s defense value."},"Armor Piercing":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) This unit’s ranged combat attacks ignore other units’ defense special equipment with “armor” in the name.","desc1":"(optional) When this unit makes a ranged combat attack, it ignores all defense special equipment of the affected unit or units while resolving the attack."},"Brawling":{"cat":"Melee damage","optional":true,"desc2":"(optional) This unit gets +1 to its damage value when making a close combat or special attack against opposing figures, regardless of the damage value used to resolve the attack.","desc1":"(optional) ’Mech only. This unit adds 1 click of damage to all of its close combat, charge, and death from above attacks."},"Bypass":{"cat":"Attack","optional":true,"desc2":"(optional) If this unit began the turn with no order tokens and in base contact with a single target captive vehicle or ’Mech, give it a move order but do not move it. Eliminate this unit to gain control of the target; it is friendly to you and ceases being a captive. If a player other than you was the last player to control the target before it became a captive, that player gains victory points for this eliminated unit.","desc1":"(optional) Give this unit a move order but do not move it. If this unit begins the turn with no order tokens and in base contact with a single captured vehicle or captured ’Mech, eliminate this unit to gain control of the captured unit. Your opponent gains victory points for the eliminated Bypass unit. The captured unit is no longer considered captured and is a friendly unit to you."},"Command":{"cat":"Attack","optional":true,"desc2":"(optional) At the beginning of your command stage, roll one six-sided die. On a result of 5 or 6, you get an extra order that turn.","desc1":"(optional) At the beginning of your turn, roll one six-sided die. A result of 5 or 6 adds one extra order to your normal order allotment for this turn."},"Decoy":{"cat":"Defense","optional":true,"desc2":"(optional) When this unit is the target of a successful ranged combat attack that is not a critical hit, the attacker must make a second attack roll. If the second attack roll fails, this unit ignores the successful attack. The second attack roll does not count as an additional attack for the attacker and does not cost an order.","desc1":"(optional) When this unit is the target of a successful ranged combat attack that is not a critical hit, the firer must make a second attack roll. If the second attack roll succeeds, this unit is hit by the attack. Otherwise, the attack misses. If a second attack roll is made, it does not count as an additional attack for the firer, and does not cost an extra order."},"Flamers":{"cat":"Energy damage","optional":true,"desc2":"(optional) This unit may be given close combat orders, regardless of its type. When this unit succeeds at a close combat attack targeting a single opposing infantry or vehicle, it gets +1 to its damage value for this attack. If the target is a ’Mech, deal no damage; instead, the target gains 2 heat. Shutdown ’Mechs ignore an attack using Flamers.","desc1":"(optional) This unit can be given a close combat order targeting a single opposing unit. When this unit succeeds at a close combat attack against an infantry or vehicle unit, add 1 click of damage to this unit’s normal damage value. When this unit succeeds at a close combat attack against a ’Mech that is not shutdown, the target takes 2 clicks of heat instead of this unit’s normal damage value."},"Full Strike":{"cat":"Melee damage","optional":true,"desc2":"(optional) When this unit makes a close combat attack, all opposing figures in base contact with its front arc become targets. Make one attack roll and compare the attack result to each target’s defense value. Score damage equal to this unit’s damage value to each target against which the attack succeeds.","desc1":null},"Grapple":{"cat":"Energy damage","optional":true,"desc2":"(optional) When this unit is in base contact with a single opposing vehicle or ’Mech figure, the figure succeeds at break away results of only 5 or 6, even if it has Evade or Jump Jets special equipment.","desc1":"(optional) When this unit is in base contact with a single opposing vehicle or ’Mech, the target unit successfully breaks away only on a die roll result of 5 or 6, even if it has the Evade or Jump Jets special equipment."},"Hand-to-Hand Weapon":{"cat":"Melee damage","optional":true,"desc2":"(optional) When this unit succeeds at a close combat attack targeting a single opposing figure, roll one six-sided die. Score damage to the target equal to the result instead of this unit’s damage value.","desc1":"(optional) ’Mech only. Give this unit a close combat action with a single opposing unit as the target. When this unit succeeds at a close combat attack, roll one six-sided die. This is the number of clicks of damage this unit delivers to the target instead of this ’Mech’s normal damage value."},"Hardened Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 2 any damage scored to this unit by ranged or close combat attacks. Hardened Armor does not reduce pushing or impact damage.","desc1":"Subtract 2 from any damage scored against this unit by close or ranged combat attacks. Hardened Armor does not reduce pushing, critical miss, charge, ram, or death from above damage."},"Heavy Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 1 any damage scored to this unit by ranged or close combat attacks. Heavy Armor does not reduce pushing or impact damage.","desc1":"Subtract 1 from any damage scored against this unit by close or ranged combat attacks. Heavy Armor does not reduce pushing, critical miss, charge, ram, or death from above damage."},"Homing Beacon":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) Give this unit a ranged combat order targeting a single opposing vehicle or ’Mech; it gets +2 to its attack value for this attack. If the attack succeeds, until the end of your turn any line of fire for a ranged combat attack using the range type drawn to the target is clear, and the target ignores hindering terrain when it is the target of ranged combat attacks using the range type.","desc1":null,"rangeNote":"(This square's colour marks its position on the SEC card — green, red, blue, black, grey in order; the range type comes from the card's own printed icon: ⚡ = energy, 🚀 = ballistic.)"},"Improved Targeting":{"cat":"Attack","optional":false,"desc2":"When this unit makes a ranged or close combat attack, you may reroll one attack die; if you do, you must accept the reroll result. If you would roll a critical hit with the rerolled die, it is not a critical hit; calculate the attack result normally. If you reroll a die from a critical miss, and the new result is not a critical miss, this unit does not take critical miss damage.","desc1":"When this unit is given a close or ranged combat order, when you roll three six-sided dice to resolve the attack you may choose to reroll one of those dice. If you do, you must accept the result of the second die roll. You may not score a critical hit with the rerolled die."},"Point Defense System":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) Any friendly figure in base contact with this unit may use this unit’s unmodified defense value instead of its own.","desc1":"(optional) Any friendly unit in base contact with this unit may use this unit’s unmodified defense value instead of its own."},"Pulse":{"cat":"Energy damage","optional":true,"desc2":"(optional) Once per turn, when this unit resolves a successful ranged combat attack against a single opposing target figure, make a second ranged combat attack against that target, which gets +2 to its defense value against the second attack. If this unit is a ’Mech, it gains 1 heat after resolving the second attack in addition to any other heat generated by the order. The second attack does not cost an order.","desc1":"(optional) When this unit succeeds at a ranged combat attack against a single target, this unit may immediately make a second ranged combat attack against the same target with a +2 modifier to the target’s defense. If the firing unit is a ’Mech, it takes an additional 1 click of heat for the second attack. Pulse can be used by a unit only once per turn; it does not cost an extra order."},"Rapid Strike":{"cat":"Melee damage","optional":true,"desc2":"(optional) Once per turn, when this unit resolves a successful close combat attack against a single opposing target figure, make a second close combat attack against that target. This unit gains 1 heat in addition to any other heat generated by the order. The second attack does not cost an order.","desc1":"(optional) ’Mech only. When this unit succeeds at a close combat attack, it may immediately make a second attack against the same target, and takes an additional 1 click of heat. Rapid Strike can be used only once per turn and does not cost an extra order."},"Reactive Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 2 any damage scored to this unit by ranged combat attacks using the range type.","desc1":"Subtract 2 from any damage scored against this unit by ballistic ranged combat attacks.","rangeNote":"(This square's colour marks its position on the SEC card — green, red, blue, black, grey in order; the range type comes from the card's own printed icon: ⚡ = energy, 🚀 = ballistic.)"},"Reflective Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 2 any damage scored to this unit by ranged combat attacks using the range type.","desc1":"Subtract 2 from any damage scored against this unit by energy ranged combat attacks.","rangeNote":"(This square's colour marks its position on the SEC card — green, red, blue, black, grey in order; the range type comes from the card's own printed icon: ⚡ = energy, 🚀 = ballistic.)"},"Repair":{"cat":"Attack","optional":true,"desc2":"(optional) This unit may be given close combat orders, regardless of its type. Make a close combat attack targeting a friendly figure; neither this unit nor the target may be in base contact with an opposing figure. Ignore all non–heat effect close combat modifiers. If the attack succeeds, repair the target of damage equal to either this unit’s damage value or the result of one six-sided die. If this unit has the attack symbol, it can repair only figures with the attack speed mode. If this unit has the attack symbol, it can repair all figures except those with the speed mode. If this unit has the attack symbol, it can repair any figure.","desc1":"(optional) This unit can be given a close combat order targeting a friendly unit to repair it. Neither unit may be in base contact with an opposing unit. All modifiers to the close combat attack are ignored, except heat effects. If the attack succeeds, you may either a) repair the target with clicks of repair equal to this unit’s damage value or b) roll 1 six-sided die and repair that many clicks to the target unit. If this unit has the attack symbol, it can repair only units with speed mode Foot. If this unit has the attack symbol, it can repair all units except those with speed mode Foot. If this unit has the attack symbol, this unit can repair any type of unit."},"Salvage":{"cat":"Attack","optional":false,"desc2":"If this unit is an infantry or a vehicle, it may be given only move orders and may not be pushed. If this unit is a ’Mech, it may be given only move or vent orders and may not make a death from above special attack.","desc1":"If this unit is a vehicle, it may not be pushed and may be given only move orders. If this unit is a ’Mech, it may be given only move or vent orders, and it may not make a death from above attack."},"Streak Missiles":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) When this unit makes a ranged combat attack targeting a single opposing figure, it ignores figure bases and terrain for line of fire purposes. If the attack succeeds, this unit gets –1 to its damage value for this attack, minimum 1. This attack may not target a shutdown ’Mech or a unit with Electronic Camouflage special equipment.","desc1":"(optional) When this unit is given a ranged combat order targeting a single unit, the line of fire is not affected by terrain or other units. If the attack succeeds, deal damage equal to this unit’s damage value reduced by 1 to a minimum of 1. This attack may not be used to target a ’Mech that is shutdown or a unit with Electronic Camouflage special equipment."},"TSEMP":{"cat":"Energy damage","optional":true,"desc2":"(optional) Give this unit a ranged combat order targeting a single opposing figure with zero or one order token. If the attack succeeds, and the target is not shutdown, give the target an order token after resolving the attack. If a ’Mech is given a second order token in this way, it shuts down; remove both tokens at the beginning of the controlling player’s next turn. If the target is at cruising level, it changes to NOE level; do not move it. If it cannot occupy the terrain at its NOE position, eliminate it.","desc1":null}};
const SE_NOTE="(This square's colour marks its position on the SEC card \u2014 green, red, blue, black, grey in order; the range type comes from the card's own printed icon: \u26A1 = energy, \uD83D\uDE80 = ballistic.)";
const ERA=UNIT.era||'2.0';
function seDesc(name){
  const s=SE_INFO[name]; if(!s) return null;
  const d=ERA==='1.0'?(s.desc1||s.desc2):(s.desc2||s.desc1);
  return d? name+': '+d+((d.indexOf('the range type')>=0)?' '+SE_NOTE:'') : name;
}
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('baseSvg');
function el(t,a,parent){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e;}
/* Incr 40: hover tooltips. For SVG art a <title> CHILD ELEMENT is the standard mechanism —
   SVGElement.title= silently no-ops in Chromium (verified: attribute never set), so the
   expando property does nothing. HTML overlays (heat3d/panels/knob3d) keep .title. */
function tip(e,t){const ti=document.createElementNS(NS,'title');ti.textContent=t;e.appendChild(ti);return e;}
const CX=320,CY=330,R=270;
const defs=el('defs',{});

 <stop offset="0%" stop-color="#3a3a40"/><stop offset="55%" stop-color="#242428"/><stop offset="100%" stop-color="#0c0c0f"/>

tip(el('circle',{cx:CX,cy:CY,r:R+11,fill:'#17171a'}),'Outer rim of the base \u2014 the sculpted band around the figure; click to twist the combat dial');

/* ==== slot geometry: stat slot at the REAR (bottom), per AoD p.10 labeled diagram.
   From the rear rim going inward: band (attack | marker | defense) nearest the rim,
   then speed, secondary, primary, and the vent box nearest the center.
   Measured on p.10 (front-up photo, tilt-corrected): vent 0.28R, primary 0.43R,
   secondary 0.57R, speed 0.71R, band 0.86R. Column 54px wide, band 78px. ==== */
const COLW=54, COLX=CX, COLTOP=428, COLBOT=540;
const BL=CX-39, BR=CX+39, BTOP=COLBOT, BBOT=580;
const P_Y=445, S_Y=483, SPD_Y=521, BAND_Y=562;

/* ==== front arc: 180° white line (9 to 3 o'clock over the top) + end ticks, per p.10 photo.
   Drawn LATER (after the base top) so it isn't covered by the dial disc — it's printed on
   the fixed top shell, since the arc is relative to the miniature, not the dial. ==== */
const arcR=R-35;
function arcPt(deg){const a=(deg-90)*Math.PI/180;return [CX+arcR*Math.cos(a),CY+arcR*Math.sin(a)];}
function drawFrontArc(){
  const FA=UNIT.arc/2; const [x0,y0]=arcPt(-FA),[x1,y1]=arcPt(FA);
  tip(el('path',{d:`M ${x0} ${y0} A ${arcR} ${arcR} 0 ${UNIT.arc>180?1:0} 1 ${x1} ${y1}`,stroke:'#e8e8ec','stroke-width':3.5,fill:'none','stroke-linecap':'round'}),
    UNIT.frontTip);
  for(const d of [-FA,FA]){
    const [x,y]=arcPt(d);const a=(d-90)*Math.PI/180;
    tip(el('line',{x1:x,y1:y,x2:x+19*Math.cos(a),y2:y+19*Math.sin(a),stroke:'#e8e8ec','stroke-width':3.5,'stroke-linecap':'round'}),
      'Front firing arc end tick');}}
/* ==== combat dial: physical disc beneath the base top. The dial face is printed dark with a
   WHITE value strip per click (2.0 numerals: dark on white, per the p.10 photo). The strip
   matches the L-window shape, so neighbouring clicks' white strips meet invisibly behind the
   cut and only this click's dark numerals show. One click = 360/18° = 20°. Group i is printed

  bRes:'Restart — from shutdown, clear heat back to the green starting squares',
  bRst:'Reset — dial to click 1, heat to 0'};
for(const id in BTN){const b=document.getElementById(id);if(b)b.title=BTN[id];}
document.getElementById('status').title='Status — describes the result of the last dial action';
area(122.85,360.35,69.3,69.3,UNIT.facTip);
/* set badge tooltip retired with the badge */
area(CX-27,388,26,34,'Vent chevron — marks the vent stat below the stat column (p.10 photo)');
area(CX-1,388,30,34,`Vent rating ${UNIT.vent} — a vent order removes ${UNIT.vent} heat (Vent button); end of turn without orders removes 1 heat (Cool 1)`);
area(CX+44,CY+178,28,28,"'Mech speed-mode glyph — the unit fights in 'Mech mode (p.11 mech art)");
area(CX-6,CY-6,12,12,'Dial center — the disc pivots here beneath the fixed base');
/* the old whole-row range areas (CX+28..CX+144) were replaced by per-glyph tips in
   rangePrint() — Peter 2026-10-20: tooltips specific to the glyph or value */
for(const t of svg.querySelectorAll('text')){
  if(!t.querySelector('textPath')) continue;
  const b=t.getBBox(); if(b.width<=0) continue;
  const txt=t.textContent;
  if(UNIT.nameTok&&txt.includes(UNIT.nameTok)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.nameTip);
  else if(UNIT.collector&&txt.includes(UNIT.collector)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.collectorTip);
  else if(UNIT.variantTok&&txt.includes(UNIT.variantTok)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.variantTip);
}
renderCombat(false);renderHeat(false);setStatus(`Starting position: click 1 of ${UNIT.life}, heat dial col2 (green starting squares). Disc at 0\u00B0.`);
</script>
</body></html>
