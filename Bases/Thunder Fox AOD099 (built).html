body{background:#111;color:#ddd;font:14px system-ui;margin:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:16px;letter-spacing:2px;margin:0;color:#bbb}

.foot{color:#888;font-size:12px;max-width:680px;text-align:center}
/* ==== 3D heat drum: 6 panels (table cols 2-7) around a vertical-pole cylinder; col7
   (shutdown) wraps around to join col2 (green start). The drum rotates about its pole axis;
   the fixed window reveals one column at a time. ==== */
#stage{position:relative;width:640px;height:980px}
/* Incr 48: perspective 480 -> 2000 — at rest the front panel's projection is now 1.015x (was
   1.065x), so the flat combat-strip digits and the projected heat rows land within ~1px of each
   other in all three rows (with 480 the stretched bottom row sat 3.7px low). Rotation sweep is
   unchanged in character; the drum face just reads flatter, as it does on the real dial. */
#heat3d{position:absolute;left:0;top:0;width:34px;height:114px;perspective:2000px;perspective-origin:50% 50%;overflow:hidden}
#heat3d .winLight{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(255,255,255,.14) 46%,rgba(0,0,0,0) 66%,rgba(0,0,0,.6) 100%)}
#drum{position:absolute;left:0;top:4px;width:34px;height:108px; /* Incr 48: 5->4 centers residual projection offset */transform-style:preserve-3d;will-change:transform}
.panel{position:absolute;left:0;top:0;width:34px;height:104px;backface-visibility:hidden;display:flex;flex-direction:column;gap:4px;border-radius:3px;box-shadow:inset 0 0 6px rgba(0,0,0,.35)}
.cell{box-sizing:border-box;width:34px;height:32px;border-radius:3px;border:1.2px solid #33333a;display:flex;align-items:center;justify-content:center;font:800 19px system-ui;flex:none}
.cell.rad{font-size:22px}
/* ==== 3D twist knob (Incr 22): a COAXIAL extension of the heat drum's cylinder — the same
   vertical pole axis (x=240), same rotateY rotation, same transition, so knob and drum turn
   as one mechanism. 12 narrow flutes = knurled grip. Fixed gradient light stays put while
   the flutes revolve (cylindrical shading). Static SVG collar + cap sit underneath. ==== */
#knob3d{position:absolute;width:30px;height:40px;perspective:420px;perspective-origin:50% 50%;cursor:pointer;z-index:6}
#knobdrum{position:absolute;left:0;top:0;width:30px;height:40px;transform-style:preserve-3d;will-change:transform}
.kflute{position:absolute;top:0;height:40px;backface-visibility:hidden;border-radius:2px}
.kflute.a{background:#3a3a42;box-shadow:inset 0 0 4px rgba(0,0,0,.4)}
.kflute.b{background:#2b2b32;box-shadow:inset 0 0 4px rgba(0,0,0,.5)}
.knobLight{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(255,255,255,.24) 48%,rgba(0,0,0,0) 74%,rgba(0,0,0,.48) 100%)}

er allotment for this turn."},"Decoy":{"cat":"Defense","optional":true,"desc2":"(optional) When this unit is the target of a successful ranged combat attack that is not a critical hit, the attacker must make a second attack roll. If the second attack roll fails, this unit ignores the successful attack. The second attack roll does not count as an additional attack for the attacker and does not cost an order.","desc1":"(optional) When this unit is the target of a successful ranged combat attack that is not a critical hit, the firer must make a second attack roll. If the second attack roll succeeds, this unit is hit by the attack. Otherwise, the attack misses. If a second attack roll is made, it does not count as an additional attack for the firer, and does not cost an extra order."},"Flamers":{"cat":"Energy damage","optional":true,"desc2":"(optional) This unit may be given close combat orders, regardless of its type. When this unit succeeds at a close combat attack targeting a single opposing infantry or vehicle, it gets +1 to its damage value for this attack. If the target is a ’Mech, deal no damage; instead, the target gains 2 heat. Shutdown ’Mechs ignore an attack using Flamers.","desc1":"(optional) This unit can be given a close combat order targeting a single opposing unit. When this unit succeeds at a close combat attack against an infantry or vehicle unit, add 1 click of damage to this unit’s normal damage value. When this unit succeeds at a close combat attack against a ’Mech that is not shutdown, the target takes 2 clicks of heat instead of this unit’s normal damage value."},"Full Strike":{"cat":"Melee damage","optional":true,"desc2":"(optional) When this unit makes a close combat attack, all opposing figures in base contact with its front arc become targets. Make one attack roll and compare the attack result to each target’s defense value. Score damage equal to this unit’s damage value to each target against which the attack succeeds.","desc1":null},"Grapple  by the order. The second attack does not cost an order.","desc1":"(optional) When this unit succeeds at a ranged combat attack against a single target, this unit may immediately make a second ranged combat attack against the same target with a +2 modifier to the target’s defense. If the firing unit is a ’Mech, it takes an additional 1 click of heat for the second attack. Pulse can be used by a unit only once per turn; it does not cost an extra order."},"Rapid Strike":{"cat":"Melee damage","optional":true,"desc2":"(optional) Once per turn, when this unit resolves a successful close combat attack against a single opposing target figure, make a second close combat attack against that target. This unit gains 1 heat in addition to any other heat generated by the order. The second attack does not cost an order.","desc1":"(optional) ’Mech only. When this unit succeeds at a close combat attack, it may immediately make a second attack against the same target, and takes an additional 1 click of heat. Rapid Strike can be used only once per turn and does not cost an extra order."},"Reactive Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 2 any damage scored to this unit by ranged combat attacks using the range type.","desc1":"Subtract 2 from any damage scored against this unit by ballistic ranged combat attacks.","rangeNote":"(This square's colour marks its position on the SEC card — green, red, blue, black, grey in order; the range type comes from the card's own printed icon: ⚡ = energy, 🚀 = ballistic.)"},"Reflective Armor":{"cat":"Defense","optional":false,"desc2":"Decrease by 2 any damage scored to this unit by ranged combat attacks using the range type.","desc1":"Subtract 2 from any damage scored against this unit by energy ranged combat attacks.","rangeNote":"(This square's colour marks its position on the SEC card — green, red, blue, black, grey in order; the range type comes from the card's own printed icon: ⚡ = energy, 🚀 = ballistic.)"},"Repair":{"cat":"Attack","optional":true,"desc2":"(optional) This unit may be given close combat orders, regardless of its type. Make a close combat attack targeting a friendly figure; neither this unit nor the target may be in base contact with an opposing figure. Ignore all non–heat effect close combat modifiers. If the attack succeeds, repair the target of damage equal to either this unit’s damage value or the result of one six-sided die. If this unit has the attack symbol, it can repair only figures with the attack speed mode. If this unit has the attack symbol, it can repair all figures except those with the speed mode. If this unit has the attack symbol, it can repair any figure.","desc1":"(optional) This unit can be given a close combat order targeting a friendly unit to repair it. Neither unit may be in base contact with an opposing unit. All modifiers to the close combat attack are ignored, except heat effects. If the attack succeeds, you may either a) repair the target with clicks of repair equal to this unit’s damage value or b) roll 1 six-sided die and repair that many clicks to the target unit. If this unit has the attack symbol, it can repair only units with speed mode Foot. If this unit has the attack symbol, it can repair all units except those with speed mode Foot. If this unit has the attack symbol, this unit can repair any type of unit."},"Salvage":{"cat":"Attack","optional":false,"desc2":"If this unit is an infantry or a vehicle, it may be given only move orders and may not be pushed. If this unit is a ’Mech, it may be given only move or vent orders and may not make a death from above special attack.","desc1":"If this unit is a vehicle, it may not be pushed and may be given only move orders. If this unit is a ’Mech, it may be given only move or vent orders, and it may not make a death from above attack."},"Streak Missiles":{"cat":"Ballistic damage","optional":true,"desc2":"(optional) When this unit makes a ranged combat attack targeting a single opposing figure, it ignores figure bases and terrain for line of fire purposes. If the attack succeeds, this unit gets –1 to its damage value for this attack, minimum 1. This attack may not target a shutdown ’Mech or a unit with Electronic Camouflage special equipment.","desc1":"(optional) When this unit is given a ranged combat order targeting a single unit, the line of fire is not affected by terrain or other units. If the attack succeeds, deal damage equal to this unit’s damage value reduced by 1 to a minimum of 1. This attack may not be used to target a ’Mech that is shutdown or a unit with Electronic Camouflage special equipment."},"TSEMP":{"cat":"Energy damage","optional":true,"desc2":"(optional) Give this unit a ranged combat order targeting a single opposing figure with zero or one order token. If the attack succeeds, and the target is not shutdown, give the target an order token after resolving the attack. If a ’Mech is given a second order token in this way, it shuts down; remove both tokens at the beginning of the controlling player’s next turn. If the target is at cruising level, it changes to NOE level; do not move it. If it cannot occupy the terrain at its NOE position, eliminate it.","desc1":null}};

/* ==== base rim: capsule (vehicle-base shape, AoD p.4/p.7 — parallel flanks, hemispherical

/* ==== firing arcs: ONE continuous rim-tracking curve (Thunder Fox Incr 3 convention) —
   Warrenborn AOD098: Arc 270 front / Rear Arc 90 rear. The front arc runs from the right
   rear wedge edge, up the right flank, across the front dome, down the left flank, to the
   left rear wedge edge: an offset curve at RIN=216 tracking the capsule edge (not a plain
   circle), so it keeps a constant 19px inset from the rim through the domes. Bracket ticks
   mark the shared ends of the front and rear arcs. Drawn LATER (drawFrontArc, after the
   base top) so the disc doesn't cover it — printed on the fixed top shell, since the arc
   is relative to the miniature, not the dial. ==== */
const RIN=216, FR=[320,275], RR=[320,705];   /* front/rear dome centers, inset print radius */
/* GENERALIZED FIRING ARCS (bulk build, Peter 2026-10-21 21:05): the shell shipped hardcoded for
   Thunder Fox's 270/90. The 27 quad-class units span four cases: 270/90 (Thunder Fox, Ursa,
   Jaguar, Xanthos...), 180/90, 360/90 (Stalking Spider - full ring), 180/0 (BF016 - no rear
   arc in its Warrenborn data). Geometry: the print tracks the base-edge offset (RIN inset).
   The REAR arc spans UNIT.rearArc about the rear dome center RR, centered on straight-down;
   ticks sit at its ends. The FRONT arc spans UNIT.arc centered on straight-up on the same
   offset curve; when front+rear = 360 (270/90) the two share the rear-dome bracket ticks (the
   approved Thunder Fox look); when they total < 360 (180/90: two 45deg side blind wedges;
   180/0: no rear at all) the front arc ends at angle \u00b1FA/2 about FR - on the front dome
   circle (\u226490deg) or continuing straight down the flank (>90deg) - with its own ticks.
   All segments sweep 0 (decreasing std angle), the approved direction. */
const RTK=UNIT.rearArc>0?(180-UNIT.rearArc)/2*Math.PI/180:null;   /* 45deg for a 90deg rear arc */
const TK_L=RTK!=null?[RR[0]-RIN*Math.sin(RTK),RR[1]+RIN*Math.cos(RTK)]:null;
const TK_R=RTK!=null?[RR[0]+RIN*Math.sin(RTK),RR[1]+RIN*Math.cos(RTK)]:null;
const ptFromFR=a=>{const r=a*Math.PI/180;   /* angle from straight-up about FR */
  if(Math.abs(a)<=90) return [CX+RIN*Math.sin(r),FR[1]-RIN*Math.cos(r)];
  return [CX+Math.sign(a)*RIN,FR[1]+RIN*(Math.abs(a)-90)*Math.PI/180];};
const FTK_R=ptFromFR(UNIT.arc/2), FTK_L=ptFromFR(-UNIT.arc/2);
function arcTickAt(pt,c){const a=Math.atan2(pt[1]-c[1],pt[0]-c[0]);

    'Firing arc bracket \u2014 arc end (AoD p.4/p.7 base layout)');}
function drawFrontArc(){
  const seg=(d,tipText)=>tip(el('path',{d,stroke:'#e8e8ec','stroke-width':3.5,fill:'none','stroke-linecap':'round'}),tipText);
  const FA=UNIT.arc, RA=UNIT.rearArc||0;
  if(RA>0){   /* rear arc about RR + its end ticks (Peter 2026-10-21 19:49: rear arc added —
     quad geometry clears the printed column by 14px, so no gap needed at the dial window) */
    seg(`M ${TK_L[0]} ${TK_L[1]} A ${RIN} ${RIN} 0 ${RA>180?1:0} 0 ${TK_R[0]} ${TK_R[1]}`,UNIT.rearTip);
    arcTickAt(TK_L,RR);arcTickAt(TK_R,RR);}
  if(FA>=360){   /* full ring (Stalking Spider 360/90): closed loop; the rear arc overprints it */
    seg(`M ${CX+RIN} ${FR[1]} A ${RIN} ${RIN} 0 0 0 ${CX-RIN} ${FR[1]} L ${CX-RIN} ${RR[1]} A ${RIN} ${RIN} 0 0 0 ${CX+RIN} ${RR[1]} Z`,
      UNIT.frontTip + ' \u2014 one continuous curve tracking the base-edge offset');
  } else if(FA+RA>=360){   /* complement of the rear arc: shares the rear ticks (Thunder Fox 270/90) */
    seg(`M ${TK_R[0]} ${TK_R[1]} A ${RIN} ${RIN} 0 0 0 ${CX+RIN} ${RR[1]} L ${CX+RIN} ${FR[1]} A ${RIN} ${RIN} 0 0 0 ${CX-RIN} ${FR[1]} L ${CX-RIN} ${RR[1]} A ${RIN} ${RIN} 0 0 0 ${TK_L[0]} ${TK_L[1]}`,
      UNIT.frontTip + ' \u2014 one continuous curve tracking the base-edge offset');
  } else {   /* front arc ends inside its own span: ticks at both ends (AOD097 180/90, BF016 180/0) */
    seg(`M ${FTK_R[0]} ${FTK_R[1]} A ${RIN} ${RIN} 0 ${FA>180?1:0} 0 ${FTK_L[0]} ${FTK_L[1]}`,
      UNIT.frontTip + ' \u2014 one continuous curve tracking the base-edge offset');
    arcTickAt(FTK_R,FR);arcTickAt(FTK_L,FR);}
}

/* value on the white strip: plain numerals, or an SE-colored cell behind them */
/* Incr 29: Peter: center the numbers in the box. dominant-baseline:central centers the
   EM box, but digit ink sits high within it (cap-to-baseline is ~72% of em and the baseline
   hangs low), so glyphs rendered visually high in the chip. Fix: explicit baseline
   placement — baseline = center + 0.355*fs puts the cap-height band optically centered. */
function val(g,px,py,w,h,txt,fs,se,tipText){
  if(se){el('rect',{x:px-w/2,y:py-h/2,width:w,height:h,rx:3,fill:SEC[se],stroke:'#3c3c44','stroke-width':1},g);}
  el('text',{x:px,y:py+fs*0.355,'font-size':fs,'font-weight':'800',fill:(se==='k'?'#f2f2f4':'#16161a'),'text-anchor':'middle'},g).textContent=txt;
  /* Peter 2026-10-20: per-VALUE tooltips — each cell carries its own hit rect (topmost within
     the click group) so hovering a value is specific to that value + its SE, not the row. */
  if(tipText){const r=el('rect',{x:px-w/2,y:py-h/2,width:w,height:h,fill:'transparent','pointer-events':'all'},g);tip(r,tipText);}}
for(let i=0;i<NSEG;i++){
  const g=el('g',{transform:`rotate(${-i*STEP} ${CX} ${CY})`},discG);
  el('path',{d:STRIP_PATH,fill:'#f4f4f0'},g);
  if(i>=UNIT.life){ /* KO'd clicks: the slot shows three bullet holes = eliminated (AoD p.2).
    Peter 2026-10-20: actual hole art (Mocks/icons/bullet-hole.png, white->transparent) replaces
    the old three-dot circles, which read as '***'. */
    /* per-hole tooltips (Peter 2026-10-20): each hole names its count and the click */
    /* Peter 2026-10-21: holes are VERTICAL — one in each of the three damage rows
       (primary, secondary, speed), taking the place of the stat values, like the real
       base's dial (was: a horizontal trio, Peter's correction). */
    [[P_Y,0],[S_Y,1],[SPD_Y,2]].forEach(([ky,k])=>{
      const im=el('image',{href:ICONS.bul,x:CX-13,y:ky-13,width:26,height:26},g);
      tip(im,`Bullet hole ${k+1} of 3 — the unit is ELIMINATED: click ${i+1-UNIT.life} past its last click (AoD p.2)`);});
    continue;}
  /* per-value tooltip text (Peter 2026-10-20): value + click + SE name & description.
     SE names come from the MWDA Game scrape (UNIT.primSEn etc.); configs without them
     (the hand-built originals) simply show the value line. */
  const seN=a=>(Array.isArray(a)?a[i]:null)||null;
  const cellTip=(label,v,name)=>`${label} ${v} — click ${i+1} of ${UNIT.life}`+(name?` — ${seDesc(name)}`:'');
  val(g,COLX,P_Y,28,28,P[i],22,primSE(i),cellTip('Primary damage',P[i],seN(UNIT.primSEn))); /* primary damage */
  val(g,COLX,S_Y,28,28,S[i],22,null,cellTip('Secondary damage',S[i],seN(UNIT.secSEn)));      /* secondary damage */
  val(g,COLX,SPD_Y,28,28,SPD[i],22,null,cellTip('Speed',SPD[i],seN(UNIT.spdSEn)));           /* speed */
  const BAND_SHIFT=-5;   /* cells up 5px = marker visually 10px lower vs the numbers (Incr 28) */
  val(g,ATK_X,BAND_Y+BAND_SHIFT,26,26,ATK[i],19,atkSE(i),cellTip('Attack',ATK[i],seN(UNIT.atkSEn))); /* attack */
  val(g,DEF_X,BAND_Y+BAND_SHIFT,26,26,DEF[i],19,defSE(i),cellTip('Defense',DEF[i],seN(UNIT.defSEn))); /* defense */
  /* starting / repair markers are printed on the dial in the band, BETWEEN the attack and
     defense cells, sitting LOW: the gap between the cells is 16px wide, the marker is 15px
     wide so it clears both cells, and its base rests at the cells' bottom edge (Incr 23,
     per the user's own dial photo — the triangle only rises into the lower half of the gap,
     never over the numbers). Green start @1, black repair @4/6/10. */
  /* Incr 26: Peter: "now it looks smaller — make it more like rulebook p.11". The p.11
     labeled diagram shows the marker as a WIDE, LOW triangle — its base spanning nearly the
     full space between the two numbers, ~2x as wide as tall. The 15x15 spike had the mass
     concentrated in a narrow column; the p.11 look is a broad flat triangle. The Warrenborn
     gif is natively 24x12 (2:1), so rendering at 28x14 restores its true aspect AND doubles
     the width. The triangle shape never touches the digits: its slanted edges only rise in
     the middle, so at the digits' inner edge (x=CX-10, 10px off center) the surface has
     risen just 4px from the bottom — below the glyph baseline. */
  /* Incr 27: white outline stripped from the Warrenborn gifs (Peter: remove the outline
     entirely). Marker art is now PNG with the outline alpha-ed out; geometry unchanged. */
  /* Incr 28: Peter: lower the triangle 10px. A literal 10px drop put the base past the
     white strip's bottom edge (BBOT=580) and the die-cut hid most of it — only 5px of white
     exist below the cells. So the 10px is achieved RELATIVE TO THE NUMBERS: the band cells
     (attack/defense) rise 5px within the horizontal arm, and the marker's base sits at the
     strip's bottom edge (y=579). Marker top is now 10px lower against the digits than in
     Incr 27, and the whole triangle stays visible inside the white strip. */
  const MKW=28, MKH=14, MKY=BAND_Y+17-MKH;
  if(i===0) tip(el('image',{href:ICONS.start,x:MK_X-MKW/2,y:MKY,width:MKW,height:MKH},g),
    'Green starting marker — click 1 is this unit\u2019s starting position; the dial begins here');
  else if(UNIT.repairClicks.includes(i)) tip(el('image',{href:ICONS.rep,x:MK_X-MKW/2,y:MKY,width:MKW,height:MKH},g),
    `Repair marker — the damage on this click can be repaired (Warrenborn repair markers: ${UNIT.repairClicks.map(c=>c+1).join(', ')} on the ${UNIT.life}-click dial)`);
  tip(g, i>=UNIT.life ? 'Eliminated — 3 clicks past the last click: bullet holes in the slot (AoD p.2)'
    : `Click ${i+1} of ${UNIT.life} — Primary ${P[i]} · Secondary ${S[i]} · Speed ${SPD[i]} · Attack ${ATK[i]} · Defense ${DEF[i]}`+
      (i===0?' — green start marker':(UNIT.repairClicks.includes(i)?' — repair marker':'')));
}
/* ==== cell overlay (Peter 2026-10-20, fix 4): neighbour strips poke into the window's TOP
   corners when the disc rotates — at 20&deg; steps the white wedge crosses the SE-coloured
   cells' top corners, lopsiding the squares (visible on Copperhead's Pulse-red primary;
   Solitude never showed it because its column cells are plain white on white). Fix: a top
   overlay re-draws the CURRENT click's five cells ABOVE all strips, so they always render as
   clean rectangles. pointer-events:none keeps cell tooltips hitting the underlying cells. ==== */
const cellOv=el('g',{'pointer-events':'none'},discG);
function renderCellOv(idx){
  cellOv.innerHTML='';
  if(idx>=UNIT.life) return;
  const g=el('g',{transform:`rotate(${-idx*STEP} ${CX} ${CY})`},cellOv);
  /* Redraw the current strip ABOVE all strips, then the start/repair marker, then the
     cells — kept from the ±42 experiment. Harmless with the fork restored: the strip is
     again wider than the window, so neighbour cells can't poke through the aperture. */
  el('path',{d:STRIP_PATH,fill:'#f4f4f0'},g);
  const MKW=28, MKH=14, MKY=BAND_Y+17-MKH;
  if(idx===0) el('image',{href:ICONS.start,x:MK_X-MKW/2,y:MKY,width:MKW,height:MKH},g);
  else if(UNIT.repairClicks.includes(idx)) el('image',{href:ICONS.rep,x:MK_X-MKW/2,y:MKY,width:MKW,height:MKH},g);
  const seN=a=>(Array.isArray(a)?a[idx]:null)||null;
  const cellTip=(label,v,name)=>`${label} ${v} — click ${idx+1} of ${UNIT.life}`+(name?` — ${seDesc(name)}`:'');
  val(g,COLX,P_Y,28,28,P[idx],22,primSE(idx),cellTip('Primary damage',P[idx],seN(UNIT.primSEn)));
  val(g,COLX,S_Y,28,28,S[idx],22,null,cellTip('Secondary damage',S[idx],seN(UNIT.secSEn)));
  val(g,COLX,SPD_Y,28,28,SPD[idx],22,null,cellTip('Speed',SPD[idx],seN(UNIT.spdSEn)));
  const BAND_SHIFT=-5;
  val(g,ATK_X,BAND_Y+BAND_SHIFT,26,26,ATK[idx],19,atkSE(idx),cellTip('Attack',ATK[idx],seN(UNIT.atkSEn)));
  val(g,DEF_X,BAND_Y+BAND_SHIFT,26,26,DEF[idx],19,defSE(idx),cellTip('Defense',DEF[idx],seN(UNIT.defSEn)));

  const tang=Math.atan2(rp.y-rq.y,rp.x-rq.x)*180/Math.PI+180;
  const RANKN={Green:1,Veteran:2,Elite:3};
  if(RANKN[UNIT.rank]){
    const NR=RANKN[UNIT.rank];
    /* Peter 19:21: align chevrons with the arc text. Text on the path rides its BASELINE on
       the arc — the glyph visual center sits ~half cap-height ABOVE the path (~9px for 20px
       font), so the stack is raised 7px in the rotated frame to match. */
    const g=el('g',{transform:`translate(${rp.x} ${rp.y}) rotate(${tang}) translate(0 -9)`});
    for(let k=0;k<NR;k++){const ry=(NR-1)*2.75-k*5.5;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M -6.5 ${ry+2.6} L 0 ${ry-2.6} L 6.5 ${ry+2.6}`);
      p.setAttribute('stroke','#e8e8ec');p.setAttribute('stroke-width',3);
      p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
      g.appendChild(p);}
    area(rp.x-9,rp.y-9,18,18,'Rank chevrons — '+UNIT.rank+' (AoD p.10 RANK box: 1 chevron Green / 2 Veteran / 3 Elite)');
  }else{
    const g=el('g',{transform:`translate(${rp.x} ${rp.y}) rotate(${tang}) translate(0 -9)`});
    const st=document.createElementNS(NS,'text');
    st.setAttribute('y',0);st.setAttribute('font-size',20);st.setAttribute('fill','#e8e8ec');
    st.setAttribute('text-anchor','middle');st.textContent='★';g.appendChild(st);
    area(rp.x-10,rp.y-10,20,20,'Unique star (AoD p.10 RANK box)');
  }
}
/* Peter 2026-10-21 20:27 arrows: collector print UP the rim — start moved 185°→206°
   (start point (117.8,687.3)→(137.5,616.0)); text still reads down the left flank from its
   start, now spanning ~206°→188° so it sits above the crest's new spot. */
/* Peter 2026-10-21 20:33: ID NOT curved — straight text. 20:36 refinement: the visible left
   edge at this spot is the straight FLANK (x=117, y 185–705 between dome centers), so the run
   is VERTICAL: rotate(90), baseline x=120 (3px in from the edge), centered at y=647.4 where
   the curved run's midpoint sat. Reads top→bottom like the original left-flank print.
   (Tangent-to-dome 106.6° was wrong — the dome curve only starts below y=705.)
   Arc path removed. Tooltip hit area still auto-follows the bbox in the loop below. */
const _st=el('text',{fill:'#c9c9cf','font-size':'16','font-weight':'800',transform:'translate(120 647.4) rotate(90)'});
_st.setAttribute('text-anchor','middle');
_st.textContent=UNIT.collector;
/* Peter 2026-10-21 19:49: expansion glyph OFF the rim — Peter's Solitude photo shows it on
   the dome just below-right of the faction crest, exactly like the approved biped placement
   (Incr 36-39: "just below and to the right of that icon", +10% size, 5px down → center
   (176,458) = crest center (157.5,395) + (18.5,63), 33px). Quad crest centers (174.65,644.65),
   so the glyph centers (193.15,707.65): x 176.65-209.65, y 691.15-724.15 — 11.85px below the
   crest (same gap as the biped), 28px clear of the heat housing (HX=238), deep inside the
   dome print area. Painted after the crest below (painted-last rule); the rim keeps only
   the collector ID. */
/* variant name on the rear-right rim, reading up the rim — mirrors the set arc (skipped for
   units without a chassis designation; Warrenborn gives quads' variants as '' by default) */
if(UNIT.variantHtml){
  const vp=(deg)=>{const a=deg*Math.PI/180;return `${320+203*Math.cos(a)} ${705+203*Math.sin(a)}`;};
  defs.innerHTML+=`<path id="varArc" d="M ${vp(64)} A 203 203 0 0 1 ${vp(120)}"/>`;
  const vn=el('text',{fill:'#c9c9cf','font-size':'16','font-weight':'800'});
  vn.innerHTML='<textPath href="#varArc" startOffset="8" text-anchor="start">'+UNIT.variantHtml+'</textPath>';
}
/* Quad 'Mech speed-mode glyph, right of the speed row (AoD rulebook p.11 Speed Mode Symbols —
   quad art, aligned with the SPD row exactly as the mech glyph sits with the speed row on
   the biped base). ICONS.q is the quad glyph traced from the p.11 diagram (Thunder Fox Incr 3). */
wicon('q',CX+58,SPD_Y,13);
drawFrontArc();
/* ==== KO / shutdown overlays ==== */
const koTint=el('path',{d:NSHAPE,fill:'#5c0808',opacity:0,'pointer-events':'none'});
const koTxt=el('text',{x:CX,y:CY+8,'font-size':'36','font-weight':'900','letter-spacing':'5',fill:'#ff9d94','text-anchor':'middle',opacity:0,'pointer-events':'none'});
koTxt.textContent='DESTROYED';
const shGlow=el('g',{opacity:0,'pointer-events':'none'});
el('rect',{x:HX-8,y:HY-8,width:HW+16,height:HH+16,rx:15,fill:'none',stroke:'#39d439','stroke-width':3},shGlow);
const shTxt=el('text',{x:HX+HW/2,y:HY-18,'font-size':'15','font-weight':'800',fill:'#7fe07f','text-anchor':'middle'},shGlow);
shTxt.textContent='☢ SHUTDOWN';
/* ==== rendering ==== */
function renderCombat(anim){
  const idx=destroyed?NSEG-1:cur;
  discG.style.transition=anim?'transform .28s cubic-bezier(.4,0,.3,1)':'none';
  discG.style.transformBox='view-box';
  discG.style.transformOrigin=`${CX}px ${CY}px`;
  discG.style.transform=`rotate(${idx*STEP}deg)`;
  renderCellOv(idx);
}
function renderHeat(anim){ setStripPos(anim);
  heat3d.title=`Heat dial — heat ${heat} of ${HEAT.length-1}`+(destroyed?' — DESTROYED':`: primary/secondary/speed ${heatMods()}`); }
function koVisual(){
  koTint.setAttribute('opacity',destroyed?0.5:0);
  koTxt.setAttribute('opacity',destroyed?1:0);
  shGlow.setAttribute('opacity',(!destroyed&&heat>=5)?1:0);
}
function setStatus(m){document.getElementById('status').textContent=m;}
document.getElementById('bDmg').onclick=()=>{if(destroyed){setStatus('Unit already destroyed.');return;}
  if(cur===UNIT.life-1){destroyed=true;renderCombat(true);koVisual();setStatus('DESTROYED — dial clicked past the last click; bullet holes in the slot.');return;}
  cur++;renderCombat(true);koVisual();
  setStatus(`Click of damage → click ${cur+1} of ${UNIT.life} — disc turned clockwise one step (${(360/NSEG).toFixed(1)}\u00B0)`);};
document.getElementById('bRep').onclick=()=>{if(destroyed||cur<=0){setStatus('Nothing to repair.');return;}
  cur--;renderCombat(true);koVisual();
  setStatus(`Click of repair → click ${cur+1} of ${UNIT.life} — disc turned counter-clockwise one step`);};
function heatMods(){
  const r=HEAT[heat];
  const f=(v)=>v==='☢'?'☢':v;
  return `primary ${f(r[0][1])}, secondary ${f(r[1][1])}, speed ${f(r[2][1])}`;
}
document.getElementById('bHeat').onclick=advanceHeat;
document.getElementById('bCool').onclick=()=>{if(destroyed){setStatus('Unit destroyed.');return;}
  if(heat>=5){setStatus('Shutdown — it can only lose heat at end of turn (Cool 1).');return;}
  if(heat<=0){setStatus('At green starting squares (col2) — vent cannot pass the start.');return;}
  heat=Math.max(0,heat-2);renderHeat(true);koVisual();
  setStatus(heat===0?'Restarted — back to green starting squares (col2).':'Vent order → now showing table col '+(heat+2)+': '+heatMods());};
document.getElementById('bCool1').onclick=()=>{if(destroyed){setStatus('Unit destroyed.');return;}
  if(heat<=0){setStatus('Already at green starting squares (col2) — cannot cool past start.');return;}
  heat--;renderHeat(true);koVisual();
  setStatus(heat===0?'Auto-restart — green squares reappeared (col2).':'End of turn, no order → now showing table col '+(heat+2)+': '+heatMods());};
document.getElementById('bRes').onclick=()=>{if(!destroyed&&heat<5){setStatus('Nothing to restart.');return;}
  heat=0;renderHeat(true);koVisual();setStatus('Restart successful — heat dial back to green starting squares (col2).');};
document.getElementById('bRst').onclick=()=>{cur=0;heat=0;destroyed=false;renderCombat(false);renderHeat(false);koVisual();
  setStatus('Reset to starting position: click 1, heat 0.');};
/* faction symbol painted LAST so the face speckles never cover it (Thunder Fox Incr 3
   position: west flank between the dome centers, clear of the arc ring at x=104 and of the
   heat housing at x>=190). Peter 2026-10-21: nudged up 14px; then down x2 (close-out 2026-10-21);
   20:27 arrows: DOWN ~53px to y=663 (AOD098 took the upper-rim spot) — blob (crest+glyph) moves as a unit;
   20:40 arrow: DOWN another ~45px to y=708 (Peter, annotated crop). */
el('image',{href:UNIT.crestURI,x:140,y:708,width:69.3,height:69.3,class:'faclogo','pointer-events':'none'});
/* Warrenborn set logo (expansion glyph) — Peter 2026-10-21 19:49: restored at the BIPED's
   approved spot (Incr 36-39): just below and to the right of the faction crest, 33px,
   unrotated. x 176.65-209.65, y 691.15-724.15 (crest center 174.65,644.65 + the biped's
   (18.5,63) offset). Painted after the crest so the face speckles never cover it. */
el('image',{href:UNIT.setURI,x:176.65,y:789.15,width:33,height:33,class:'faclogo','pointer-events':'none'});
/* ==== Incr 40: tooltips on everything (Peter). Native hover tooltips: HTML .title on the
   3D heat assembly (panels, window, knob), SVGElement.title on SVG art, and transparent hit
   areas over flat face prints. Areas sit only over face art — never over the L-window (the
   dial panels show through the die-cut and must keep hover), the knob, or click targets.
   Wall-shadow strips in the window got pointer-events:none so panel tooltips reach edges. ==== */
function area(x,y,w,h,t){const r=el('rect',{x,y,width:w,height:h,fill:'none','pointer-events':'all'});tip(r,t);return r;}
const BTN={bDmg:'Click of Damage — turn the combat dial clockwise one click (20°)',
  bRep:'Click of Repair — turn the combat dial counter-clockwise one click',
  bHeat:'Click of Heat — turn the heat dial one click clockwise (or click the 3D twist knob on the base)',
  bCool:'Vent Order — reduce heat by 2 (cannot pass the green starting squares; locked in shutdown)',
  bCool1:'Cool 1 (end of turn) — reduce heat by 1',
  bRes:'Restart — from shutdown, clear heat back to the green starting squares',
  bRst:'Reset — dial to click 1, heat to 0'};
for(const id in BTN){const b=document.getElementById(id);if(b)b.title=BTN[id];}
document.getElementById('status').title='Status — describes the result of the last dial action';
area(140,708,69.3,69.3,UNIT.facTip);   /* crest hit area follows the crest (was stale at 122.85,360.35) */
area(176.65,789.15,33,33,UNIT.setTip);  /* expansion glyph hit area follows the glyph */
area(CX-27,COLTOP-32,26,34,'Vent chevron — marks the vent stat above the stat column');
area(CX-1,COLTOP-32,30,34,`Vent rating ${UNIT.vent} — a vent order removes ${UNIT.vent} heat (Vent button); end of turn without orders removes 1 heat (Cool 1)`);
area(CX+58-13,SPD_Y-8,26,16,"Quad 'Mech speed-mode glyph — the unit fights in Quad 'Mech mode, aligned with the speed row (AoD rulebook p.11 Speed Mode Symbols)");
area(CX-6,490-6,12,12,"Dial center — the disc pivots at (320,675) beneath the fixed base; the capsule's geometric center is (320,490)");
/* the old whole-row range areas (CX+28..CX+144) were replaced by per-glyph tips in
   rangePrint() — Peter 2026-10-20: tooltips specific to the glyph or value */
for(const t of svg.querySelectorAll('text')){
  if(!t.querySelector('textPath')) continue;
  const b=t.getBBox(); if(b.width<=0) continue;
  const txt=t.textContent;
  if(UNIT.nameTok&&txt.includes(UNIT.nameTok)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.nameTip);
  else if(UNIT.collector&&txt.includes(UNIT.collector)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.collectorTip);
  else if(UNIT.variantTok&&txt.includes(UNIT.variantTok)) area(b.x-3,b.y-3,b.width+6,b.height+6,UNIT.variantTip);
}
renderCombat(false);renderHeat(false);setStatus(`Starting position: click 1 of ${UNIT.life}, heat dial col2 (green starting squares). Disc at 0\u00B0.`);
</script>
