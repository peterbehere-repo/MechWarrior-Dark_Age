<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dossier Folder — MechWarrior: Dark Age</title><style>body{background:#14171c;color:#d8dde3;font:14px/1.5 system-ui,sans-serif;margin:0;padding:24px}
h1{color:#fff;font-size:22px;margin:0 0 4px}h2{color:#7ec8ff;font-size:16px;margin:26px 0 8px;border-bottom:1px solid #2a2f38;padding-bottom:5px}
a{color:#7ec8ff;text-decoration:none}a:hover{text-decoration:underline}
.crumbs{color:#666;font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#1c2129;border:1px solid #2a2f38;border-radius:8px;padding:8px;text-align:center}
.card img{width:100%;border-radius:4px}
.card .nm{font-size:12px;margin-top:6px;line-height:1.3}
.card .pt{color:#888;font-size:11px}
ul{list-style:none;margin:0;padding:0;columns:3;column-gap:32px}li{break-inside:avoid}
span{color:#888;font-size:12px;margin-right:6px;display:inline-block;min-width:44px;text-align:right}
.cnt{color:#666;font-size:12px;font-weight:normal}
footer{margin-top:40px;color:#555;font-size:12px;border-top:1px solid #2a2f38;padding-top:12px}
.fbar{margin:0 0 18px}
.srow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.srow input{flex:1 1 240px;min-width:0;background:#1c2129;border:1px solid #2a2f38;border-radius:8px;
  color:#d8dde3;font:inherit;font-size:13px;padding:8px 11px;outline:none}
.srow input:focus{border-color:#7ec8ff}
.srow input::placeholder{color:#5c6672}
.srow select{background:#1c2129;border:1px solid #2a2f38;border-radius:8px;color:#aab6c4;font:inherit;
  font-size:12.5px;padding:8px 9px;outline:none}
.grp{display:flex;align-items:flex-start;gap:8px;padding:1px 0}
.glab{flex:0 0 54px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#666;
  font-weight:600;padding-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;flex:1 1 auto;scrollbar-width:thin}
@media(min-width:760px){.chips{flex-wrap:wrap;overflow:visible;padding-bottom:0}}
.grid .card .nm{text-wrap:pretty}
.grid .card .pt{text-wrap:balance}
.chips::-webkit-scrollbar{height:5px}
.chips::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:3px}
.chip{flex:0 0 auto;font:inherit;font-size:11.5px;line-height:1;padding:6px 9px;border-radius:6px;
  background:#1c2129;border:1px solid #2a2f38;color:#a2aebb;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:#3d4a5a;color:#d8dde3}
.chip.on{background:#16303c;border-color:#7ec8ff;color:#cfeaff}
.chip .c{opacity:.55;margin-left:5px;font-size:10.5px}
.chip[disabled]{opacity:.3;cursor:default}
.chip[disabled]:hover{border-color:#2a2f38;color:#a2aebb}
.fsum{display:flex;align-items:center;gap:10px;border-top:1px solid #222831;margin-top:7px;
  padding-top:9px;font-size:12px;color:#888}
.fsum b{color:#d8dde3;font-weight:600}
.lnk{margin-left:auto;background:none;border:0;color:#7ec8ff;font:inherit;font-size:12px;
  cursor:pointer;padding:0}
.lnk[hidden]{display:none}
a.cardlink{display:block;color:inherit;text-decoration:none}
.grid .card .nm{color:#d8dde3}
.grid .card:hover{border-color:#3d4a5a}
.nav{display:flex;align-items:center;gap:14px;margin:22px 0 0;font-size:13px}
.nav .sp{margin-left:auto}
.facts{margin:0 0 16px;font-size:13px;color:#8a94a0;display:flex;flex-wrap:wrap;
  gap:4px 0;align-items:baseline}
.facts>span{white-space:nowrap}
.facts>span+span::before{content:"|";color:#3d4a5a;margin:0 9px}
.facts b{color:#d8dde3;font-weight:600}
.folder{width:100%;max-width:980px;margin:0 auto;height:min(78vh,720px)}
@media(max-width:640px){.folder{height:min(62vh,560px)}}
.tip{font-size:12px;color:#666;margin:10px 0 0}
</style></head><body>

<p class="crumbs"><a href="index.html">Home</a> › <a href="dossiers.html">Dossiers</a> › <span id="crumb">Dossier</span></p>
<h1 id="who">Loading dossier…</h1>
<p class="facts" id="facts"></p>
<dark-age-dossier id="folder" class="folder"></dark-age-dossier>
<p class="tip">Drag to orbit · scroll to zoom · turn the folder over to read the filing notes.</p>
<div class="nav" id="nav"></div>
<script src="manifest.js"></script>
<script src="dossier-element.js"></script>
<script>
(function(){
  var ALL=window.DOSSIERS.slice().sort(function(a,b){return a.n<b.n?-1:1});
  var byId={}; ALL.forEach(function(d,i){byId[d.i]=i;});
  var id=(location.search.match(/[?&]id=([^&]+)/)||[])[1]||ALL[0].i;
  id=decodeURIComponent(id);
  var i=byId[id]; if(i==null){ i=0; id=ALL[0].i; }
  var d=ALL[i], TEX='Tex/'+d.i+'/';
  var name=document.title;
  document.getElementById('who').textContent=d.n+' ';
  document.getElementById('who').insertAdjacentHTML('beforeend',
    '<span class="cnt">('+d.i.toUpperCase()+')</span>');
  document.getElementById('crumb').textContent=d.n;
  document.getElementById('facts').innerHTML=
    ['<b>'+d.u+'</b>',d.f,d.r,d.t,d.s,'DOB '+d.dob,d.era]
      .map(function(t){return '<span>'+t+'</span>'}).join('');
  var el=document.getElementById('folder');
  el.setDossier({
    name:d.n, date:d.dob, code:d.i, filed:d.dob,
    meta:d.u+' · '+d.f+' · '+d.s,
    front:TEX+'front.webp', back:TEX+'back.webp', inside:TEX+'inside.webp',
    page1:TEX+'page1.webp', page2:TEX+'page2.webp', page3:TEX+'page3.webp', page4:TEX+'page4.webp'
  }).then(function(){ el.reset(); el.open(); });
  var prev=i>0?ALL[i-1]:null, next=i<ALL.length-1?ALL[i+1]:null;
  document.getElementById('nav').innerHTML=
    (prev?'<a href="Viewer.html?id='+prev.i+'">← '+prev.n+'</a>':'<span></span>')+
    '<a class="sp" href="../dossiers.html">All '+ALL.length+' dossiers</a>'+
    (next?'<a href="Viewer.html?id='+next.i+'">'+next.n+' →</a>':'<span></span>');
  document.title=d.n+' — Dossier Folder — MechWarrior: Dark Age';
})();
</script>

<footer>MechWarrior: Dark Age fan project — not affiliated with WizKids or Catalyst Game Labs.</footer>
</body></html>
